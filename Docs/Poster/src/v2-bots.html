<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>#fig { padding: 0; width: 1320px; }</style></head><body>
<!-- Poster box: 33 cm wide at 40 px/cm. battle-11 final (Docs/Battle11Balance.md). -->
<div id="fig"><div id="c"></div></div>
<script>
const data = [
  { diff: '어려움', rows: [['고수', 100, [95, 100]], ['중수', 81, [60, 80]], ['초보', 3, null]] },
  { diff: '쉬움', rows: [['고수', 100, null], ['중수', 99, [90, 100]], ['초보', 77, [50, 70]]] },
];
const A = '#C01C75', W = 1320, PW = 620, PH = 200, topY = 92, left = 20;
const y = v => topY + PH - v / 100 * PH;
let s = `<svg width="${W}" height="${topY + PH + 56}" font-family="G">
<defs><pattern id="band" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="10" height="10" fill="#fff"/><rect width="3.5" height="10" fill="#BDBDBD"/></pattern></defs>`;
data.forEach((d, i) => {
  const ox = i * (PW + 80);
  s += `<text x="${ox + left}" y="34" font-size="34" font-weight="700" fill="#111">${d.diff}</text>
        <line x1="${ox + left}" x2="${ox + PW}" y1="${y(0)}" y2="${y(0)}" stroke="#222" stroke-width="2.5"/>`;
  const bw = 120, gap = (PW - left - 3 * bw) / 3;
  d.rows.forEach(([name, v, band], j) => {
    const bx = ox + left + gap / 2 + j * (bw + gap);
    if (band) s += `<rect x="${bx - 14}" y="${y(band[1])}" width="${bw + 28}" height="${y(band[0]) - y(band[1])}" fill="url(#band)" stroke="#9A9A9A" stroke-width="2" stroke-dasharray="6 4"/>`;
    const h = Math.max(PH * v / 100, 5);
    s += `<path d="M${bx},${y(0)} V${y(0) - h + 5} q0,-5 5,-5 H${bx + bw - 5} q5,0 5,5 V${y(0)} Z" fill="${A}"/>
      <text x="${bx + bw / 2}" y="${y(0) - h - 12}" font-size="36" font-weight="700" fill="#111" text-anchor="middle">${v}%</text>
      <text x="${bx + bw / 2}" y="${y(0) + 40}" font-size="30" font-weight="700" fill="#333" text-anchor="middle">${name}</text>`;
  });
});
s += `<text x="${W}" y="34" font-size="26" fill="#666" text-anchor="end">▨ 목표 범위</text></svg>`;
document.getElementById('c').innerHTML = s;
</script></body></html>
