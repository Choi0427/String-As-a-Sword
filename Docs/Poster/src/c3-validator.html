<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<script src="board.js"></script><script src="chart.js"></script>
<style>
#fig { padding: 0; width: 1320px; }
.row { display: flex; align-items: flex-start; justify-content: space-between; }
.panel h4 { font-size: 28px; font-weight: 700; margin-bottom: 12px; white-space: nowrap; }
.panel h4 span { color: var(--accent); margin-right: 6px; }
pre { background: #141414; color: #EDEDED; border-radius: 12px; padding: 18px 20px; font-size: 22px; line-height: 1.28; width: 270px; height: 330px; }
pre .k { color: #F39AC8; } pre .h { color: #fff; font-weight: 700; background: rgba(192,28,117,.55); }
.arr { align-self: center; font-size: 46px; color: var(--accent); font-weight: 700; margin-top: 20px; }
.cap { font-size: 24px; color: #444; margin-top: 10px; line-height: 1.35; white-space: nowrap; }
.cap b { color: var(--accent); }
</style></head><body>
<!-- Poster box: 33 x 11.5 cm at 40 px/cm -->
<div id="fig"><div class="row">
  <div class="panel"><h4><span>①</span>텍스트 채보</h4><pre id="code"></pre><div class="cap">0 빈칸 · 1 일반 · 2 강공격</div></div>
  <div class="arr">→</div>
  <div class="panel"><h4><span>②</span>판 위의 공격</h4><div id="atk"></div><div class="cap">노트 236 · 예고 2노트</div></div>
  <div class="arr">→</div>
  <div class="panel"><h4><span>③</span>64칸 자동 검사</h4><div id="heat"></div><div class="cap">안전 칸(·)까지 걸음 ≤ 2 → <b>통과</b></div></div>
  <div class="panel" style="margin-top:46px"><div id="fail"></div><div class="cap">예고 1노트라면<br><b id="ft"></b></div></div>
</div></div>
<script>
const C = window.CHART, sh = C.shapes['이중고리'], atk = C.attacks.find(a => a.shape === '이중고리');
document.getElementById('code').innerHTML = `<span class="k">shape</span> 이중고리\n` + sh.grid.join('\n') + `\n<span class="h">${atk.note} 이중고리 ${atk.warning}</span>`;
document.getElementById('atk').innerHTML = board({ size: 330, grid: sh.grid, id: 'a' });
const dist = [];
for (let r = 0; r < 8; r++) { dist.push([]); for (let c = 0; c < 8; c++) {
  let best = 99; for (let rr = 0; rr < 8; rr++) for (let cc = 0; cc < 8; cc++) if (sh.grid[rr][cc] === '0') best = Math.min(best, Math.abs(r - rr) + Math.abs(c - cc));
  dist[r].push(best); } }
const heat = (W, size, id, nums) => {
  const text = [];
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const d = dist[r][c];
    if (nums || d > W) text.push({ r, c, t: d > W ? '✗' : (d === 0 ? '·' : d), fill: d > W ? '#fff' : (d === 0 ? '#999' : '#111'), size: size / 8 * .5 });
  }
  return board({ size, id, text, cellFill: (r, c) => dist[r][c] > W ? ACCENT : (dist[r][c] === 0 ? '#FFFFFF' : (dist[r][c] === 1 ? '#F7E3EE' : '#EBC0D6')) });
};
document.getElementById('heat').innerHTML = heat(atk.warning, 330, 'h2', true);
document.getElementById('fail').innerHTML = heat(1, 210, 'h1', false);
document.getElementById('ft').textContent = `${dist.flat().filter(d => d > 1).length}칸 실패`;
</script></body></html>
