<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<script src="board.js"></script>
<style>#fig { padding: 0; width: 600px; }</style></head><body>
<!-- Poster box: 15 x 15.5 cm at 40 px/cm -->
<div id="fig"><div id="b"></div></div>
<script>
const S = 520, s = S / 8, ox = 70, oy = 92;
const g = Array.from({ length: 8 }, () => '00000000');
const ctr = (r, c) => [c * s + s / 2, r * s + s / 2];
const pl = pts => pts.map(p => ctr(p[0], p[1]).join(',')).join(' ');
const marker = `<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="${ACCENT}"/></marker></defs>`;
const badge = (x, y, t) => `<circle cx="${x}" cy="${y}" r="25" fill="${ACCENT}" stroke="#fff" stroke-width="4"/>
  <text x="${x}" y="${y + 10}" text-anchor="middle" font-size="28" font-weight="700" fill="#fff" font-family="G">${t}</text>`;
const extra = marker +
  `<polyline points="${pl([[0, 3], [5, 3], [5, 1]])}" fill="none" stroke="${ACCENT}" stroke-width="8" stroke-dasharray="18 11" stroke-linejoin="round" marker-end="url(#ah)"/>` +
  `<polyline points="${pl([[5, 1], [0, 1]])}" fill="none" stroke="${ACCENT}" stroke-width="8" stroke-linejoin="round" marker-end="url(#ah)"/>` +
  `<rect x="2" y="${3 * s + 2}" width="${S - 4}" height="${5 * s - 4}" fill="none" stroke="${ACCENT}" stroke-width="5" stroke-dasharray="12 9"/>` +
  `<text x="${S - 14}" y="${s / 2 + 10}" text-anchor="end" font-size="28" font-weight="700" fill="#fff" font-family="G">검이 닿는 곳</text>` +
  `<rect x="${S - 310}" y="${S - 54}" width="300" height="44" rx="8" fill="#fff" fill-opacity=".92"/>` +
  `<text x="${S - 20}" y="${S - 22}" text-anchor="end" font-size="28" font-weight="700" fill="${ACCENT}" font-family="G">잡음이 생기는 아래 5줄</text>` +
  badge(ctr(3, 3)[0] + 36, ctr(3, 3)[1], '1') + badge(ctr(2, 1)[0] - 38, ctr(2, 1)[1], '2');
const inner = board({ size: S, grid: g, labels: false, id: 'lp',
  rowTint: [{ rows: [3, 4, 5, 6, 7], fill: 'rgba(192,28,117,0.13)' }, { rows: [0], fill: '#1b1b1b' }],
  noise: [{ r: 5, c: 1 }, { r: 6, c: 6 }],
  pieces: [{ r: 0, c: 1, glyph: '♞', color: '#fff', stroke: '#1b1b1b', scale: .82 }, { r: 0, c: 3, glyph: '♞', color: '#777', stroke: '#1b1b1b', scale: .82 }],
  extra }).replace('<svg ', `<svg x="${ox}" y="${oy}" `);
const kx = ox + ctr(0, 1)[0];
document.getElementById('b').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="${oy + S + 8}">${marker}
  <text x="${ox + S / 2}" y="78" text-anchor="middle" font-size="96" class="chess" fill="#111">♚</text>
  
  <line x1="${kx}" y1="${oy + 6}" x2="${ox + S / 2 - 46}" y2="44" stroke="${ACCENT}" stroke-width="8" marker-end="url(#ah)"/>
  ${badge(kx - 36, 52, '3')}
  <text x="${ox + S / 2 + 62}" y="46" font-size="28" font-weight="700" font-family="G" fill="#111">왕</text><text x="${ox + S / 2 + 62}" y="78" font-size="26" font-weight="700" font-family="G" fill="${ACCENT}">J · 공명 8노트</text>
  ${inner}</svg>`;
</script></body></html>
