<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
#fig { padding: 0; width: 1320px; display: flex; gap: 20px; }
.shot { position: relative; flex: 1; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 10px; background: #111; }
.shot img { width: 100%; height: 100%; object-fit: fill; display: block; }
.badge { position: absolute; left: 14px; top: 14px; display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,.94); border-radius: 999px; padding: 6px 20px 4px 6px; font-size: 30px; font-weight: 700; color: #111; }
.badge b { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; padding-top: 3px; }
</style></head><body>
<!-- Poster box: 33 cm wide at 40 px/cm. Photos: ../shots/L1_c.png, ../shots/L2_c.png (object-position set per shot below) -->
<div id="fig">
  <div class="shot"><img id="l1" src="../shots/L1_c.png"><div class="badge"><b>①</b>아래 5줄에서 잡음 줍기</div></div>
  <div class="shot"><img id="l2" src="../shots/L2_c.png"><div class="badge"><b>③</b>맨 윗줄에서 J: 8노트 공명</div></div>
</div>
<script>
// Crop focus per shot, overridable as ?l1=50%25+60%25&l2=...
const q = new URLSearchParams(location.search);
for (const id of ['l1', 'l2']) document.getElementById(id).style.objectPosition = q.get(id) || '50% 50%';
</script></body></html>
