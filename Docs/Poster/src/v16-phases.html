<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
#fig { padding: 0; width: 1320px; }
.cols { display: flex; gap: 18px; }
.col { flex: 1; text-align: center; }
.col p { font-size: 28px; color: #555; margin: 0 0 10px; white-space: nowrap; }
.col h3 { font-size: 34px; font-weight: 700; margin: 0 0 2px; white-space: nowrap; }
.col h3 span { color: var(--accent); margin-right: 10px; }
.shot { aspect-ratio: 890 / 712; overflow: hidden; border-radius: 10px; background: #111; }
.shot img { width: 100%; height: 100%; object-fit: fill; display: block; }
</style></head><body>
<!-- Poster box: 33 cm wide at 40 px/cm. Photos: ../shots/P1.png .. P3.png, cropped square around the board -->
<div id="fig">
  <div class="cols">
    <div class="col"><h3><span>1단계</span>정통 체스</h3><p>킹의 3×3</p><div class="shot"><img id="p1" src="../shots/P1_c.png"></div></div>
    <div class="col"><h3><span>2단계</span>페어리 체스</h3><p>룩 + 나이트</p><div class="shot"><img id="p2" src="../shots/P2_c.png"></div></div>
    <div class="col"><h3><span>3단계</span>체스에 없는 규칙</h3><p>판을 감는 고리</p><div class="shot"><img id="p3" src="../shots/P3_c.png"></div></div>
  </div>
  <div class="legend" style="font-size:28px;gap:40px;margin-top:16px;justify-content:center">
    <span>밝은 칸 = 막기(K)·피하기</span><span>빗금 칸 = 피하기만</span><span>숫자 = 공격까지 남은 노트</span>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
for (const id of ['p1', 'p2', 'p3']) document.getElementById(id).style.objectPosition = q.get(id) || '50% 55%';
</script></body></html>
